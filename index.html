<!DOCTYPE html>
<html>

<head>

<meta charset="utf-8">
<title>ESG MailCatcher</title>

<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>

<link rel="stylesheet" href="style.css">

</head>


<body>

<div class="container">

    <div class="header">
        <h2>ESG MailImpact V.1</h2>
        <img src="images/cgi_logo.png" class="logo">
    </div>

    <!-- NEW HORIZONTAL WRAPPER -->
    <div class="main">

        <!-- LEFT COLUMN -->
        <div class="left">

            <div class="card">

                <div class="metric">
                    <span class="label">Pièces jointes :</span>
                    <span id="attachments">Calcul...</span>
                </div>

                <div class="metric">
                    <span class="label">Images dans le mail :</span>
                    <span id="images">Calcul...</span>
                </div>

                <div class="metric">
                    <span class="label">Taille du contenu :</span>
                    <span id="bodySize">Calcul...</span>
                </div>

                <div class="metric">
                    <span class="label">Destinataires :</span>
                    <span id="recipients">Calcul...</span>
                </div>

                <div class="metric total">
                    <span class="label">Taille totale estimée :</span>
                    <span id="totalSize">Calcul...</span>
                </div>

            </div>

        </div>

        <!-- RIGHT COLUMN -->
        <div class="right">

            <div class="impactBox">
                <div class="impactTitle">Impact carbone estimé</div>
                <div id="impactValue" class="impactValue">Calcul...</div>
            </div>

            <div id="advice" class="advice"></div>

        </div>

    </div>

</div>



<script>

Office.onReady(() => {

    const item = Office.context.mailbox?.item;

    if(!item){
        document.body.innerHTML = "Cette page doit être ouverte dans Outlook.";
        return;
    }

    calculateImpact(item);

});


function formatSize(bytes){
    if(bytes < 1024) return bytes + " B";
    if(bytes < 1024*1024) return (bytes/1024).toFixed(1) + " KB";
    return (bytes/(1024*1024)).toFixed(2) + " MB";
}

function calculateImpact(item){

    let attachments = item.attachments || [];
    let attachmentBytes = 0;

    attachments.forEach(a => attachmentBytes += a.size);

    document.getElementById("attachments").innerText =
    formatSize(attachmentBytes);


    const recipients =
        (item.to?.length || 0) +
        (item.cc?.length || 0) +
        (item.bcc?.length || 0);

    document.getElementById("recipients").innerText = recipients;


    item.body.getAsync("text", function(result){

        let text = result.value || "";
        let bodyBytes = text.length;
        let bodyKB = bodyBytes / 1024;

        document.getElementById("bodySize").innerText =
        formatSize(bodyBytes);


        item.body.getAsync("html", function(res){

            let html = res.value || "";
            let imgCount = (html.match(/<img/gi) || []).length;

            document.getElementById("images").innerText = imgCount;

            let imageBytes = imgCount * 100 * 1024; // ~100KB par image
            let totalBytes = attachmentBytes + bodyBytes + imageBytes;

            document.getElementById("totalSize").innerText =
            formatSize(totalBytes);


            let impact = (totalBytes / (1024*1024)) * Math.max(recipients,1) * 0.02;

            let impactDisplay = impact.toFixed(3) + " g CO₂";

            let level = "green";
            if(impact > 0.150) level = "orange";
            if(impact > 1) level = "red";

            let impactElement = document.getElementById("impactValue");
            impactElement.innerText = impactDisplay;
            impactElement.className = "impactValue " + level;


            // --- LOGIQUE ADVICE UNIQUE ---
            let issues = [];

            if(attachmentBytes > 2 * 1024 * 1024)
                issues.push("attachments");

            if(imgCount > 3)
                issues.push("images");

            if(recipients > 10)
                issues.push("recipients");

            if(bodyKB > 512)
                issues.push("body");


            let finalAdvice = "";

            if(issues.length === 0){
                finalAdvice = "Impact faible. Bon usage des emails.";
            }
            else if(issues.length === 1){
                switch(issues[0]){
                    case "attachments":
                        finalAdvice = "Utilisez un lien OneDrive plutôt qu'une pièce jointe.";
                        break;
                    case "images":
                        finalAdvice = "Réduisez les images dans la signature.";
                        break;
                    case "recipients":
                        finalAdvice = "Limitez les destinataires en copie.";
                        break;
                    case "body":
                        finalAdvice = "Essayez de raccourcir votre message.";
                        break;
                }
            }
            else{
                finalAdvice = "Vous devez optimiser votre email.";
            }


            document.getElementById("advice").innerHTML =
            "<b>Conseils ESG :</b><br>" + finalAdvice;

        });

    });

}

</script>


</body>
</html>
